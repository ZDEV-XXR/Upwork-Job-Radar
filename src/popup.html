<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      padding: 14px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      color: #222;
      background: #fff;
    }

    h3 {
      font-size: 15px;
      font-weight: 700;
      color: #14a800;
      margin-bottom: 10px;
    }

    /* ── Status bar ── */
    #auth-status {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 5px;
      margin-bottom: 10px;
      background: #f4f4f4;
    }
    #auth-status.logged-in  { color: #14a800; background: #f0fff0; }
    #auth-status.logged-out { color: #cc0000; background: #fff0f0; }
    #auth-status.checking   { color: #777;    background: #f4f4f4; }

    /* ── Timer ── */
    .timer-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f4f4f4;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .timer-label { font-size: 11px; color: #666; }
    #countdown   { font-weight: 700; color: #14a800; font-size: 15px; }

    /* ── Scan now button ── */
    #scan-now-btn {
      font-size: 11px;
      padding: 4px 10px;
      background: #14a800;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
    }
    #scan-now-btn:hover { background: #0f8500; }

    /* ── Input + add ── */
    #keyword-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    #keyword-input:focus { outline: none; border-color: #14a800; }

    button { cursor: pointer; }

    #add-btn {
      width: 100%;
      padding: 9px;
      background: #14a800;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    #add-btn:hover { background: #0f8500; }

    #login-btn {
      width: 100%;
      padding: 9px;
      background: #ff4b2b;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      display: none;
    }
    #login-btn:hover { background: #d93a1e; }

    /* ── Keyword list ── */
    #keywordList { margin-bottom: 10px; }

    .keyword-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      margin: 4px 0;
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 5px;
    }
    .keyword-text {
      flex-grow: 1;
      font-size: 13px;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .delete-btn {
      flex-shrink: 0;
      margin-left: 8px;
      width: 22px;
      height: 22px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .delete-btn:hover { background: #d93636; }

    /* ── Divider ── */
    hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }

    /* ── Recent jobs ── */
    .section-title {
      font-weight: 700;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 8px;
    }

    .no-jobs { font-size: 12px; color: #999; text-align: center; padding: 10px 0; }

    .recent-item {
      position: relative;
      padding: 10px 12px;
      margin-bottom: 7px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-left: 4px solid #14a800;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      transition: box-shadow .15s;
    }
    .recent-item:hover  { box-shadow: 0 2px 6px rgba(0,0,0,.1); background: #f9fff9; }
    .recent-item:active { transform: scale(0.98); }

    .job-title {
      font-weight: 600;
      font-size: 13px;
      padding-right: 22px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #111;
    }
    .job-meta {
      font-size: 11px;
      color: #888;
    }
    .job-keyword {
      display: inline-block;
      background: #e8f5e2;
      color: #14a800;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 600;
      margin-right: 4px;
    }

    .clear-job-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      background: #eee;
      color: #666;
      border: none;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clear-job-btn:hover { background: #ff4d4d; color: #fff; }
  </style>
</head>
<body>

  <h3>⚡ Upwork Radar</h3>


  <div class="support-container" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; text-align: center;">
  
  <a href='https://ko-fi.com/zdev821925' target='_blank'><img height='36' style='border:0px;height:36px;' src='https://storage.ko-fi.com/cdn/kofi6.png?v=6' border='0' alt='Buy Me a Coffee at ko-fi.com' /></a>
  </div>
  
  <div id="auth-status" class="checking">Checking login...</div>

  <button id="login-btn">🔑 Open Upwork &amp; Log In</button>

  <div class="timer-box">
    <div>
      <div class="timer-label">Next scan in</div>
      <div id="countdown">--:--</div>
    </div>
    <button id="scan-now-btn">Scan now</button>
  </div>

  <input type="text" id="keyword-input" placeholder="Add keyword (e.g. React Developer)">
  <button id="add-btn">+ Add Keyword</button>

  <div id="keywordList"></div>

  <hr>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
    <div class="section-title" style="margin:0;">Latest Matches</div>
    <button id="clear-all-btn" title="Clear all matches" style="background:none;border:none;color:#999;font-size:11px;cursor:pointer;padding:2px 6px;border-radius:4px;">✕ Clear all</button>
  </div>
  <div id="recentJobsList"></div>

 <!--  <button id="debug-btn" style="width:100%;padding:6px;background:#444;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer;margin-top:8px;">🛠 Debug Dump (check console)</button> -->
  <div id="debug-out" style="font-size:10px;color:#333;margin-top:6px;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto;"></div>
  <script src="popup.js"></script>
</body>
</html>
